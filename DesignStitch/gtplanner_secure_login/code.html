<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GTPlanner - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e1e0ff",
                        "surface-container": "#eceef0",
                        "tertiary-container": "#221eb5",
                        "on-surface-variant": "#43474c",
                        "surface-tint": "#4e6073",
                        "on-tertiary-fixed": "#07006c",
                        "on-primary": "#ffffff",
                        "secondary": "#00677d",
                        "surface": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "surface-variant": "#e0e3e5",
                        "secondary-fixed-dim": "#4cd6fb",
                        "on-background": "#191c1e",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f7f9fb",
                        "background": "#f7f9fb",
                        "primary-fixed": "#d1e4fb",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "surface-container-high": "#e6e8ea",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2d3133",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#005c70",
                        "on-secondary-fixed-variant": "#004e5f",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#b5c8df",
                        "on-primary-fixed-variant": "#36485b",
                        "inverse-primary": "#b5c8df",
                        "on-tertiary-container": "#9b9eff",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191c1e",
                        "secondary-container": "#50d9fe",
                        "surface-container-highest": "#e0e3e5",
                        "outline-variant": "#c4c6cd",
                        "outline": "#74777d",
                        "primary-container": "#2c3e50",
                        "tertiary": "#0c008e",
                        "on-secondary-fixed": "#001f27",
                        "on-primary-fixed": "#091d2e",
                        "on-primary-container": "#96a9be",
                        "primary": "#162839",
                        "surface-container-low": "#f2f4f6",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#b3ebff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "2xl": "48px",
                        "md": "16px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "container-max": "1280px",
                        "base": "4px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "code-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Lightweight atmospheric texture pattern */
        .bg-tech-pattern {
            background-image: radial-gradient(circle at 1px 1px, #e0e3e5 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-on-background">
<!-- Background Texture -->
<div class="absolute inset-0 bg-tech-pattern opacity-60 pointer-events-none"></div>
<!-- Main Card Container -->
<main class="w-full max-w-[440px] px-md md:px-0 relative z-10">
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.05)] p-xl">
<!-- Branding & Header -->
<header class="text-center mb-xl flex flex-col items-center">
<div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-on-primary text-[24px]">terminal</span>
</div>
<div class="text-headline-md font-headline-md font-bold text-primary mb-md tracking-tight">GTPlanner</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-sm">Secure Login</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Authenticate to access engineering workspaces.</p>
</header>
<!-- Login Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<input class="w-full px-md py-3 bg-surface border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors duration-200" id="email" name="email" placeholder="user@gtplanner.dev" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="block text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
</div>
<input class="w-full px-md py-3 bg-surface border border-outline-variant rounded-lg text-code-md font-code-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors duration-200 tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full py-3 px-md bg-secondary text-on-secondary rounded-lg text-body-md font-body-md font-bold hover:bg-secondary/90 active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-sm" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Security Badge Footer -->
<footer class="mt-xl flex justify-center border-t border-surface-variant pt-lg">
<div class="inline-flex items-center px-sm py-xs rounded-full bg-secondary-fixed/20 text-on-secondary-fixed-variant text-label-caps font-label-caps space-x-xs border border-secondary-fixed-dim/30">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="tracking-wide">JWT-Secured Environment</span>
</div>
</footer>
</div>
</main>
</body></html>
