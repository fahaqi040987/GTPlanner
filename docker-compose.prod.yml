# GTPlanner Docker Compose - Production Environment
# This configuration is for production deployment with optimized containers

version: '3.8'

services:
  # PostgreSQL Database (Production)
  db:
    image: postgres:15-alpine
    container_name: gtplanner-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: ${POSTGRES_DB:-gtplanner_db}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gtplanner-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend Service (Production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gtplanner-backend-prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gtplanner}:${POSTGRES_PASSWORD:-change_this_password}@db:5432/${POSTGRES_DB:-gtplanner_db}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - VECTOR_SERVICE_BASE_URL=${VECTOR_SERVICE_BASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - POCKETFLOW_TRACING_DEBUG=${POCKETFLOW_TRACING_DEBUG:-false}
    volumes:
      - ./logs:/app/logs
      - ./database/backups:/app/backups
    ports:
      - "11211:11211"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11211/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gtplanner-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend (Production - Built Static Files)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.backend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:11211}
        - VITE_WS_BASE_URL=${VITE_WS_BASE_URL:-ws://localhost:11211}
    container_name: gtplanner-frontend-prod
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gtplanner-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Production with SSL)
  nginx:
    image: nginx:alpine
    container_name: gtplanner-nginx-prod
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - gtplanner-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local

networks:
  gtplanner-network:
    driver: bridge